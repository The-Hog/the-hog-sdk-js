name: Release

on:
  push:
    tags:
      - v*
      - sdk-js-v*
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use npm with trusted publishing support
        run: npm install -g npm@11

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Pack dry run
        run: npm pack --dry-run

      - name: Verify CLI help
        run: node dist/esm/cli/index.js --help

      - name: Publish to npm
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm publish --access public --provenance
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
